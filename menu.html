<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORBITAL — Menu</title><link rel="stylesheet" href="styles.css"></head><body><div class="stars"></div><header class="nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>ORBITAL<small>DINING BEYOND EARTH</small></span></a><nav><a href="index.html">Home</a><a href="pizza.html">Pizza</a><a href="menu.html">Menu</a><a href="reserve.html">Reserve a table</a></nav></header><main><section class="menu-section page-section"><div class="section-kicker">03 / THE MENU</div><div class="section-head"><div><h2>Fuel your <em>curiosity.</em></h2><p>Every plate is prepared for the journey.</p></div><div class="pill-note">✦ &nbsp; 1 galactic credit = $1</div></div><div id="menu-grid"></div></section></main><script src="menu.js"></script><script>const grid=document.querySelector('#menu-grid');['Starters','Mains','Desserts','Drinks'].forEach(category=>{const dishes=MENU.filter(d=>d.category===category);grid.insertAdjacentHTML('beforeend',`<div class="menu-category"><h3>${category}<span>✦</span></h3><div class="dish-list">${dishes.map(d=>`<article class="dish"><div class="dish-art">${d.emoji}</div><div class="dish-info"><div class="dish-title"><h4>${d.name}</h4><strong>${d.price} GC</strong></div><p>${d.description}</p><div class="dish-bottom"><div class="stars">★★★★★</div><button class="add" type="button">+ Add</button></div></div></article>`).join('')}</div></div>`)});</script></body></html>
